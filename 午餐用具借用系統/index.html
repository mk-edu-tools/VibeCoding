<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入圓潤可愛的字體 (Zen Maru Gothic) -->
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
      body {
        font-family: 'Zen Maru Gothic', sans-serif;
        background-color: #fdfcf0; 
        background-image: radial-gradient(#e5e7eb 1px, transparent 1px);
        background-size: 20px 20px;
        touch-action: manipulation;
        color: #4a4a4a;
      }
      
      /* --- 吉卜力風格元件 --- */
      .ghibli-card {
        background-color: rgba(255, 255, 255, 0.95);
        border: 2px solid #e0d4b8;
        box-shadow: 0 8px 16px rgba(92, 110, 88, 0.1);
        border-radius: 24px;
      }

      .nature-btn {
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
        overflow: hidden;
      }
      .nature-btn:active { transform: scale(0.9); }
      .nature-btn.active {
        background-color: #5c8d6d;
        color: white;
        border-color: #4a7556;
        box-shadow: 0 4px 0 #3e6148;
        transform: translateY(-2px);
      }
      .nature-btn.active .btn-subtext { color: #e8f5e9; }

      .item-btn {
        transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        border: 3px solid #f0e6d2;
      }
      .item-btn:hover { transform: translateY(-5px); }
      .item-btn.selected {
        background-color: #fcebc5;
        border-color: #dcb668;
        box-shadow: 0 0 0 4px #fae1a7; 
        transform: scale(1.05) rotate(2deg);
      }
      .item-btn.disabled {
        opacity: 0.5;
        cursor: not-allowed;
        background-color: #f3f4f6;
      }

      .catbus-btn {
        background: linear-gradient(135deg, #e8a853 0%, #d48831 100%);
        color: white;
        box-shadow: 0 6px 0 #b36f23;
        transition: all 0.2s;
      }
      .catbus-btn:active:not(:disabled) {
        transform: translateY(6px);
        box-shadow: 0 0 0 #b36f23;
      }
      .catbus-btn:disabled {
        background: #d1d5db;
        box-shadow: none;
        color: #9ca3af;
        transform: none;
      }
      .catbus-btn.error-state {
        background: #ef4444; 
        box-shadow: 0 6px 0 #b91c1c;
      }

      .soot-sprite {
        width: 40px; height: 40px;
        background-color: #2d2d2d;
        border-radius: 50%; position: relative;
        animation: soot-bounce 0.6s infinite alternate;
      }
      .soot-sprite::before, .soot-sprite::after {
        content: ''; position: absolute; top: 10px; width: 10px; height: 10px;
        background: white; border-radius: 50%;
      }
      .soot-sprite::before { left: 8px; }
      .soot-sprite::after { right: 8px; }
      .soot-sprite .pupil {
        position: absolute; top: 13px; width: 4px; height: 4px;
        background: black; border-radius: 50%;
        animation: look-around 2s infinite;
      }
      .soot-sprite .pupil.left { left: 11px; }
      .soot-sprite .pupil.right { right: 11px; }

      @keyframes soot-bounce { from { transform: translateY(0); } to { transform: translateY(-10px); } }
      @keyframes look-around { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
      .animate-fade-in { animation: fadeIn 0.5s ease-out; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  </head>
  <body class="p-4 md:p-6 min-h-screen flex flex-col items-center">

    <div class="w-full max-w-3xl ghibli-card overflow-hidden pb-8 relative">
      
      <!-- 標題區 -->
      <div class="bg-[#5c8d6d] p-6 text-white text-center relative overflow-hidden">
        <i class="fa-solid fa-leaf absolute -bottom-4 -left-4 text-6xl text-white opacity-10 transform rotate-45"></i>
        <i class="fa-solid fa-leaf absolute top-2 right-4 text-4xl text-white opacity-10 transform -rotate-12"></i>
        
        <h1 class="text-3xl font-black mb-2 tracking-wider flex items-center justify-center gap-3 shadow-text">
          <span class="bg-white text-[#5c8d6d] rounded-full w-10 h-10 flex items-center justify-center text-xl shadow-md">
            <i class="fa-solid fa-utensils"></i>
          </span>
          餐具借用站
        </h1>
        <p class="text-[#dbece0] text-sm font-bold tracking-wide">
          <i class="fa-solid fa-tree mr-1"></i> 請點選：年級 &rarr; 班級 &rarr; 姓名
        </p>
      </div>

      <div class="p-4 md:p-8 space-y-8">
        
        <!-- 載入中動畫 -->
        <div id="loading" class="flex flex-col items-center justify-center py-20">
          <div class="soot-sprite mb-4">
             <div class="pupil left"></div>
             <div class="pupil right"></div>
          </div>
          <p class="text-gray-500 font-bold animate-pulse tracking-widest">精靈搬運資料中...</p>
        </div>

        <!-- 主要表單 -->
        <div id="mainForm" class="hidden space-y-8">
          
          <!-- 1. 身分選擇區 -->
          <div class="bg-[#fcf8f0] p-6 rounded-3xl border-4 border-[#e8dcc5] border-dashed space-y-6 relative">
            <div class="absolute -top-5 left-6 bg-[#d48831] text-white px-4 py-1 rounded-full font-bold shadow-sm border-2 border-white transform -rotate-2">
              Step 1. 我是誰？
            </div>

            <!-- 年級 -->
            <div class="mt-2">
              <p class="text-[#8c7b64] text-sm mb-3 font-bold ml-1 flex items-center">
                <i class="fa-solid fa-seedling mr-2 text-green-500"></i>請選擇年級
              </p>
              <div id="gradeGrid" class="grid grid-cols-3 sm:grid-cols-6 gap-3"></div>
            </div>

            <!-- 班級 -->
            <div id="classSection" class="hidden opacity-0 transition-all duration-300">
              <div class="border-t-2 border-dashed border-[#e0d4b8] mb-4 mt-2"></div>
              <div class="flex justify-between items-end mb-3">
                <p class="text-[#8c7b64] text-sm font-bold ml-1 flex items-center">
                  <i class="fa-solid fa-shapes mr-2 text-yellow-500"></i>請選擇班級
                </p>
                <button id="reselectClassBtn" onclick="expandClassGrid()" class="hidden text-xs text-[#5c8d6d] font-bold hover:underline">
                  <i class="fa-solid fa-rotate-left mr-1"></i>重選班級
                </button>
              </div>
              <div id="classGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3 transition-all duration-300"></div>
            </div>

            <!-- 座號 -->
            <div id="seatSection" class="hidden opacity-0 transition-all duration-300">
               <div class="border-t-2 border-dashed border-[#e0d4b8] my-4"></div>
               <p class="text-[#8c7b64] text-sm mb-3 font-bold ml-1 flex items-center">
                 <i class="fa-solid fa-child-reaching mr-2 text-blue-400"></i>請選擇你的名字
               </p>
               <div id="seatGrid" class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3"></div>
            </div>

            <!-- 確認資訊 -->
            <div id="infoArea" class="mt-4 hidden transition-all animate-fade-in">
              <div class="flex items-center justify-between bg-white p-4 rounded-2xl text-[#5c8d6d] border-2 border-[#5c8d6d] shadow-sm relative overflow-hidden">
                <div class="absolute right-0 top-0 opacity-10 transform translate-x-1/4 -translate-y-1/4">
                  <i class="fa-brands fa-pagelines text-8xl"></i>
                </div>
                <div class="z-10">
                  <span class="text-xs text-[#8c7b64] font-bold tracking-wider">借用學生</span>
                  <div class="font-black text-2xl text-gray-800 mt-1" id="displayStudentName">--</div>
                </div>
                <div class="text-right z-10">
                  <span class="text-xs text-[#8c7b64] font-bold tracking-wider">導師</span>
                  <div class="font-bold text-xl text-[#5c8d6d] mt-1" id="displayTeacherName">--</div>
                </div>
              </div>
            </div>
          </div>

          <!-- 2. 餐具選擇區 -->
          <div id="itemSection" class="opacity-50 pointer-events-none transition-all duration-300 transform translate-y-4">
            <div class="relative mb-4">
              <span class="absolute -top-3 left-0 bg-[#5c8d6d] text-white px-4 py-1 rounded-full font-bold shadow-sm text-sm border-2 border-white transform rotate-1 inline-block z-10">
                Step 2. 借什麼？
              </span>
              <div class="border-t-4 border-[#e8dcc5] mt-3"></div>
            </div>

            <div class="grid grid-cols-3 gap-3 md:gap-5 mt-6">
              <!-- 碗 -->
              <div onclick="toggleItem(this, '碗')" class="item-btn cursor-pointer bg-white rounded-[2rem] p-2 flex flex-col items-center justify-center transition-all h-40 group">
                <i class="fa-solid fa-bowl-rice text-6xl text-orange-400 mb-3 drop-shadow-sm group-hover:rotate-12 transition-transform"></i>
                <span class="font-bold text-gray-600 text-xl group-hover:text-orange-500">碗</span>
              </div>
              <!-- 湯匙 -->
              <div onclick="toggleItem(this, '湯匙')" class="item-btn cursor-pointer bg-white rounded-[2rem] p-2 flex flex-col items-center justify-center transition-all h-40 group">
                <i class="fa-solid fa-spoon text-6xl text-[#5c8d6d] mb-3 drop-shadow-sm group-hover:-rotate-12 transition-transform"></i>
                <span class="font-bold text-gray-600 text-xl group-hover:text-[#5c8d6d]">湯匙</span>
              </div>
              <!-- 筷子 -->
              <div onclick="toggleItem(this, '筷子')" class="item-btn cursor-pointer bg-white rounded-[2rem] p-2 flex flex-col items-center justify-center transition-all h-40 group">
                <svg class="w-16 h-16 mb-3 text-red-400 drop-shadow-sm group-hover:scale-110 transition-transform" fill="currentColor" viewBox="0 0 24 24">
                  <path d="M21.92,2.38a1,1,0,0,0-1.41,0L2.38,20.51a1,1,0,1,0,1.41,1.41L21.92,3.8A1,1,0,0,0,21.92,2.38Z"/>
                  <path d="M17.92,2.38a1,1,0,0,0-1.41,0L2.38,16.51a1,1,0,0,0,1.41,1.41L17.92,3.8A1,1,0,0,0,17.92,2.38Z"/>
                </svg>
                <span class="font-bold text-gray-600 text-xl group-hover:text-red-500">筷子</span>
              </div>
            </div>
          </div>

          <button onclick="submitBorrow()" id="submitBtn" disabled class="w-full catbus-btn font-black py-5 rounded-2xl text-2xl tracking-widest disabled:opacity-50 disabled:cursor-not-allowed">
            請先完成選擇
          </button>
        </div>

        <!-- 3. 公佈欄：所有未歸還項目 -->
        <div id="returnSection" class="pt-6 relative">
          <div class="absolute top-0 left-0 w-full border-t-4 border-dashed border-[#d1d5db]"></div>
          
          <div class="flex flex-col items-center mb-4 mt-2">
            <div class="flex items-center gap-3">
               <h2 class="text-xl font-bold text-gray-600 flex items-center justify-center">
                <span class="bg-[#d1d5db] px-4 py-1 rounded-full text-sm text-gray-700 font-black shadow-sm flex items-center">
                  <i class="fa-solid fa-clipboard-list mr-2"></i>全校未歸還公佈欄
                </span>
              </h2>
              <button onclick="manualRefresh()" class="w-8 h-8 rounded-full bg-white border-2 border-gray-200 text-gray-400 hover:text-[#5c8d6d] hover:border-[#5c8d6d] flex items-center justify-center shadow-sm transition-all" title="立即檢查最新資料">
                  <i id="refreshIcon" class="fa-solid fa-rotate"></i>
              </button>
            </div>
            <div id="lastUpdatedTime" class="text-[10px] text-gray-400 font-bold mt-1 opacity-70 tracking-wide">
               讀取中...
            </div>
          </div>
          
          <div id="recordsList" class="space-y-3 max-h-80 overflow-y-auto pr-1"></div>
        </div>

      </div>
      
      <!-- 頁尾 -->
      <div class="text-center text-xs text-[#8c7b64] font-bold opacity-60 mt-4">
        學務處 • 森林餐具借用站
      </div>

    </div>

    <script>
      // ==========================================
      // 模擬資料 (預覽模式用)
      // ==========================================
      if (typeof google === 'undefined') {
        console.warn('正在預覽模式運行，使用模擬資料。');
        var mockRunner = {
          withSuccessHandler: function(func) { this.successHandler = func; return this; },
          withFailureHandler: function(func) { this.errorHandler = func; return this; },
          getInitData: function() {
             setTimeout(() => {
               this.successHandler({
                  studentMap: { 
                    '101': { '1': '王小明', '2': '李小華' }, 
                    '505': { '1': '高大壯' }
                  },
                  teacherMap: { '101': '陳老師', '505': '許老師' }
               });
             }, 800);
          },
          handleBorrow: function(data) {
             if(data.studentName === '高大壯') {
                 setTimeout(() => this.errorHandler(new Error('同學，你還有餐具未歸還！')), 400);
             } else {
                 setTimeout(() => this.successHandler({success:true}), 600);
             }
          },
          getAllActiveRecords: function() {
             setTimeout(() => {
               const mockRecords = [
                 {id:'mock-1', time:'12/01 12:00', classId:'505', seatNo:'1', studentName:'高大壯', teacherName:'許老師', items:'碗'}
               ];
               this.successHandler(mockRecords);
             }, 800);
          },
          getStudentActiveRecords: function(c, s) {
             setTimeout(() => {
               if (s == '1') {
                   const mockRecords = [
                     {id:'mock-1', time:'12/01 12:00', classId:'505', seatNo:'1', studentName:'高大壯', teacherName:'許老師', items:'碗'}
                   ];
                   this.successHandler(mockRecords);
               } else {
                   this.successHandler([]);
               }
             }, 400);
          },
          handleReturn: function(id) {
             setTimeout(() => this.successHandler({success:true}), 600);
          }
        };
        window.google = { script: { run: mockRunner } };
      }
      // ==========================================

      let globalData = {};
      let selectedItems = new Set();
      let currentStudent = { grade: '', classId: '', seatNo: '', name: '', teacher: '' };
      const CACHE_KEY = 'TABLEWARE_APP_CACHE_V2';
      let autoRefreshTimer = null;
      const REFRESH_INTERVAL = 30000;

      window.onload = function() {
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          try { initForm(JSON.parse(cached)); } catch(e) { localStorage.removeItem(CACHE_KEY); }
        }

        google.script.run
          .withSuccessHandler(function(data) {
             localStorage.setItem(CACHE_KEY, JSON.stringify(data));
             if (!cached) initForm(data);
             else globalData = data; 
          })
          .getInitData();

        manualRefresh();
        startAutoRefresh();
      };

      function startAutoRefresh() {
        if (autoRefreshTimer) clearInterval(autoRefreshTimer);
        autoRefreshTimer = setInterval(() => { fetchAllActiveRecords(true); }, REFRESH_INTERVAL);
      }

      function manualRefresh() {
        startAutoRefresh();
        fetchAllActiveRecords(false);
      }

      function initForm(data) {
        globalData = data;
        renderGradeGrid();
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('mainForm').classList.remove('hidden');
      }

      function renderGradeGrid() {
        const gradeGrid = document.getElementById('gradeGrid');
        gradeGrid.innerHTML = '';
        const allClasses = Object.keys(globalData.studentMap);
        const grades = new Set();
        allClasses.forEach(c => {
            const gradeChar = c.charAt(0);
            if (!isNaN(gradeChar)) grades.add(gradeChar);
        });
        const sortedGrades = Array.from(grades).sort((a, b) => parseInt(a) - parseInt(b));
        sortedGrades.forEach(g => {
          const btn = document.createElement('button');
          btn.className = 'nature-btn bg-white border-2 border-gray-200 text-gray-600 font-bold py-3 px-2 rounded-2xl text-xl shadow-sm hover:border-[#5c8d6d] focus:outline-none';
          btn.innerText = g + ' 年';
          btn.onclick = () => selectGrade(g, btn);
          gradeGrid.appendChild(btn);
        });
      }

      function selectGrade(grade, btnElement) {
        document.querySelectorAll('#gradeGrid .nature-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        currentStudent.grade = grade;
        currentStudent.classId = ''; currentStudent.seatNo = ''; currentStudent.name = '';
        resetSeatAndBelow();
        document.getElementById('seatSection').classList.add('hidden');
        document.getElementById('seatSection').classList.add('opacity-0');
        renderClassGrid(grade);
        document.getElementById('reselectClassBtn').classList.add('hidden');
      }

      function renderClassGrid(grade) {
        const classGrid = document.getElementById('classGrid');
        const classSection = document.getElementById('classSection');
        classGrid.innerHTML = '';
        classGrid.classList.remove('hidden');
        const allClasses = Object.keys(globalData.studentMap);
        const filteredClasses = allClasses.filter(c => c.startsWith(grade)).sort((a, b) => parseInt(a) - parseInt(b));
        filteredClasses.forEach(cls => {
          const btn = document.createElement('button');
          btn.dataset.classId = cls;
          btn.className = 'nature-btn bg-white border-2 border-gray-200 text-gray-600 font-bold py-3 px-2 rounded-2xl text-lg shadow-sm hover:border-[#5c8d6d] focus:outline-none';
          btn.innerText = cls + ' 班';
          btn.onclick = () => selectClass(cls, btn);
          classGrid.appendChild(btn);
        });
        classSection.classList.remove('hidden');
        setTimeout(() => classSection.classList.remove('opacity-0'), 50);
      }

      function expandClassGrid() {
        const classGrid = document.getElementById('classGrid');
        classGrid.querySelectorAll('button').forEach(btn => {
            btn.classList.remove('hidden'); btn.classList.remove('active'); 
        });
        document.getElementById('reselectClassBtn').classList.add('hidden');
        resetSeatAndBelow();
      }

      function selectClass(classId, btnElement) {
        const classGrid = document.getElementById('classGrid');
        classGrid.querySelectorAll('button').forEach(btn => {
            if (btn !== btnElement) btn.classList.add('hidden');
            else { btn.classList.remove('hidden'); btn.classList.add('active'); }
        });
        document.getElementById('reselectClassBtn').classList.remove('hidden');
        currentStudent.classId = classId; currentStudent.seatNo = ''; currentStudent.name = '';
        resetSeatAndBelow();
        renderSeatGrid(classId);
      }

      function renderSeatGrid(classId) {
        const seatGrid = document.getElementById('seatGrid');
        const seatSection = document.getElementById('seatSection');
        seatGrid.innerHTML = '';
        if (globalData.studentMap[classId]) {
          const seats = Object.keys(globalData.studentMap[classId]).sort((a,b) => parseInt(a) - parseInt(b));
          seats.forEach(seat => {
            const name = globalData.studentMap[classId][seat];
            const btn = document.createElement('button');
            btn.className = 'nature-btn bg-white border-2 border-gray-200 text-gray-600 py-2 px-1 rounded-2xl flex flex-col items-center justify-center shadow-sm hover:border-[#5c8d6d] focus:outline-none min-h-[84px]';
            btn.innerHTML = `<span class="text-2xl font-black mb-1">${seat}</span><span class="text-xs text-gray-500 font-bold btn-subtext truncate w-full px-1 text-center">${name}</span>`;
            btn.onclick = () => selectSeat(seat, btn);
            seatGrid.appendChild(btn);
          });
          seatSection.classList.remove('hidden');
          setTimeout(() => seatSection.classList.remove('opacity-0'), 50);
        }
      }

      function selectSeat(seatNo, btnElement) {
        document.querySelectorAll('#seatGrid .nature-btn').forEach(b => b.classList.remove('active'));
        btnElement.classList.add('active');
        currentStudent.seatNo = seatNo;
        identifyStudent();
      }

      function resetSeatAndBelow() {
        document.getElementById('infoArea').classList.add('hidden');
        document.getElementById('itemSection').classList.add('opacity-50', 'pointer-events-none');
        document.getElementById('itemSection').classList.remove('translate-y-0');
        document.getElementById('itemSection').classList.add('translate-y-4');
        
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = '請先完成選擇';
        btn.classList.remove('error-state', 'bg-red-500', 'text-white');

        selectedItems.clear();
        document.querySelectorAll('.item-btn').forEach(el => {
            el.classList.remove('selected', 'disabled'); 
            el.style.pointerEvents = 'auto'; 
        });
        checkButtonState();
      }

      function fullReset() {
        // 1. Reset Student Data
        currentStudent = { grade: '', classId: '', seatNo: '', name: '', teacher: '' };
        
        // 2. Reset Grade Grid UI
        document.querySelectorAll('#gradeGrid .nature-btn').forEach(b => b.classList.remove('active'));
        
        // 3. Hide Class Section
        const classSection = document.getElementById('classSection');
        classSection.classList.add('hidden');
        classSection.classList.remove('opacity-100');
        classSection.classList.add('opacity-0');
        
        // 4. Hide Seat Section
        const seatSection = document.getElementById('seatSection');
        seatSection.classList.add('hidden');
        seatSection.classList.add('opacity-0');
        
        // 5. Hide Reselect Button
        document.getElementById('reselectClassBtn').classList.add('hidden');

        // 6. Reset Bottom Part
        resetSeatAndBelow();
        
        // 7. Scroll to top
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }

      function identifyStudent() {
        const { classId, seatNo } = currentStudent;
        if (classId && seatNo) {
          const studentName = globalData.studentMap[classId][seatNo];
          const teacherName = globalData.teacherMap[classId] || '未設定';
          currentStudent.name = studentName; currentStudent.teacher = teacherName;
          document.getElementById('displayStudentName').innerText = studentName;
          document.getElementById('displayTeacherName').innerText = teacherName;
          document.getElementById('infoArea').classList.remove('hidden');
          const itemSec = document.getElementById('itemSection');
          itemSec.classList.remove('opacity-50', 'pointer-events-none', 'translate-y-4');
          itemSec.classList.add('translate-y-0');
          setTimeout(() => itemSec.scrollIntoView({ behavior: 'smooth', block: 'center' }), 100);
          
          checkButtonState();
          
          fetchStudentRecords();
        }
      }
      
      function fetchStudentRecords() {
        if (!currentStudent.classId) return;
        
        const btn = document.getElementById('submitBtn');
        btn.innerText = '檢查紀錄中...';
        
        google.script.run
          .withSuccessHandler(function(records) {
             if (records.length > 0) {
                 lockBorrow(records);
             } else {
                 unlockBorrow();
             }
          })
          .getStudentActiveRecords(currentStudent.classId, currentStudent.seatNo);
      }

      function lockBorrow(records) {
          const btn = document.getElementById('submitBtn');
          btn.disabled = true;
          btn.innerHTML = '<i class="fa-solid fa-triangle-exclamation mr-2"></i>尚有未歸還餐具';
          btn.classList.add('error-state');
          
          document.querySelectorAll('.item-btn').forEach(el => {
             el.classList.add('disabled');
             el.style.pointerEvents = 'none';
          });
      }
      
      function unlockBorrow() {
          const btn = document.getElementById('submitBtn');
          btn.classList.remove('error-state');
          document.querySelectorAll('.item-btn').forEach(el => {
             el.classList.remove('disabled');
             el.style.pointerEvents = 'auto';
          });
          checkButtonState();
      }

      function toggleItem(element, item) {
        if (selectedItems.has(item)) { selectedItems.delete(item); element.classList.remove('selected'); }
        else { selectedItems.add(item); element.classList.add('selected'); }
        checkButtonState();
      }

      function checkButtonState() {
        const btn = document.getElementById('submitBtn');
        if (btn.classList.contains('error-state')) return;

        const hasStudent = currentStudent.name !== '';
        const hasItems = selectedItems.size > 0;
        if (hasStudent) {
          if (hasItems) { btn.disabled = false; btn.innerText = '出發借餐具！'; }
          else { btn.disabled = true; btn.innerText = '請選擇餐具'; }
        } else { btn.disabled = true; btn.innerText = '請先完成選擇'; }
      }

      function submitBorrow() {
        if (selectedItems.size === 0) return;
        const btn = document.getElementById('submitBtn');
        const originalText = btn.innerText;
        btn.disabled = true; btn.innerText = '處理中...';

        const formData = {
          classId: currentStudent.classId, seatNo: currentStudent.seatNo,
          studentName: currentStudent.name, teacherName: currentStudent.teacher,
          items: Array.from(selectedItems)
        };

        google.script.run
          .withSuccessHandler(function(response) {
            Swal.fire({
              icon: 'success', title: '借用成功', text: '記得要還喔！',
              confirmButtonColor: '#5c8d6d', timer: 2000, showConfirmButton: false
            }).then(() => {
                fullReset();
            });
            manualRefresh();
          })
          .withFailureHandler(function(err) {
            showError(err);
            btn.disabled = false; btn.innerText = originalText;
          })
          .handleBorrow(formData);
      }

      function fetchAllActiveRecords(isAuto = false) {
        const icon = document.getElementById('refreshIcon');
        if (icon) icon.classList.add('fa-spin');
        
        google.script.run
          .withSuccessHandler((records) => {
             renderRecords(records);
             if (icon) icon.classList.remove('fa-spin');
             updateTime();
             
             if (currentStudent.name && !isAuto) {
                 const myRecords = records.filter(r => r.classId == currentStudent.classId && r.seatNo == currentStudent.seatNo);
                 if (myRecords.length > 0) lockBorrow(myRecords);
                 else unlockBorrow();
             }
          })
          .withFailureHandler((err) => {
             console.error("更新失敗", err);
             if (icon) icon.classList.remove('fa-spin');
          })
          .getAllActiveRecords();
      }

      function updateTime() {
        const now = new Date();
        const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        const el = document.getElementById('lastUpdatedTime');
        if (el) el.innerText = `最後更新: ${timeString}`;
      }

      function renderRecords(records) {
        const list = document.getElementById('recordsList');
        list.innerHTML = '';

        if (records.length === 0) {
           list.innerHTML = `
             <div class="text-center text-gray-400 py-6 text-sm">
               <i class="fa-solid fa-check-circle text-green-500 mb-2 text-2xl"></i><br>
               太棒了！目前沒有未歸還的餐具
             </div>
           `;
           return;
        }

        records.forEach(rec => {
          const div = document.createElement('div');
          div.className = 'flex justify-between items-center bg-[#fffbef] p-3 rounded-xl border-l-4 border-l-[#d48831] shadow-sm';
          
          if (rec.classId == currentStudent.classId && rec.seatNo == currentStudent.seatNo) {
              div.classList.add('ring-2', 'ring-red-400');
          }
          
          div.innerHTML = `
            <div class="flex-1">
              <div class="flex items-center gap-2 mb-1">
                 <span class="bg-[#5c8d6d] text-white px-2 py-0.5 rounded text-xs font-bold">
                   ${rec.classId}班 ${rec.seatNo}號
                 </span>
                 <span class="text-gray-700 font-bold text-sm">
                   ${rec.studentName}
                 </span>
                 <span class="text-xs text-gray-400">
                   (${rec.teacherName})
                 </span>
              </div>
              <div class="flex justify-between items-center pr-2">
                <div class="text-[#d48831] font-bold text-sm">
                   <i class="fa-solid fa-basket-shopping mr-1"></i>${rec.items}
                </div>
                <div class="text-xs text-gray-400">
                   ${rec.time}
                </div>
              </div>
            </div>
            <button onclick="returnItem('${rec.id}', this)" class="ml-2 bg-gray-200 text-gray-700 px-6 py-4 rounded-xl text-lg font-bold hover:bg-[#5c8d6d] hover:text-white transition-colors shadow-md whitespace-nowrap min-w-[80px]">
              歸還
            </button>
          `;
          list.appendChild(div);
        });
      }

      function returnItem(recordId, btnElement) {
        btnElement.innerText = '...';
        btnElement.disabled = true;
        google.script.run
          .withSuccessHandler(function() {
             Swal.fire({
              icon: 'success', title: '歸還完成', toast: true,
              position: 'top-end', showConfirmButton: false,
              confirmButtonColor: '#5c8d6d', timer: 1500
            });
            manualRefresh();
          })
          .withFailureHandler(showError)
          .handleReturn(recordId);
      }

      function showError(err) {
        console.error(err);
        Swal.fire({
          icon: 'error', title: '發生錯誤',
          text: err.message || '系統發生未知錯誤', confirmButtonColor: '#d33'
        });
      }
    </script>
  </body>
</html>

  .duty-list{columns:1}.two-col{grid-template-columns:1fr}.content{padding:18px 16px 50px}.topbar{padding:14px 16px}
}
.menu-btn{display:none}

/* ---------- 日期工具 ---------- */
const TODAY=new Date();
const ymd=d=>d.toISOString().slice(0,10);
const WD=["日","一","二","三","四","五","六"];
const fmtD=s=>{if(!s)return"—";const d=new Date(s+"T00:00:00");return `${d.getMonth()+1}月${d.getDate()}日（${WD[d.getDay()]}）`;};
const dayNum=s=>new Date(s+"T00:00:00").getDate();
const dayW=s=>"週"+WD[new Date(s+"T00:00:00").getDay()];
const monthKey=s=>{const d=new Date(s+"T00:00:00");return `${d.getFullYear()}年 ${d.getMonth()+1}月`;};
const daysFromToday=s=>Math.round((new Date(s+"T00:00:00")-new Date(ymd(TODAY)+"T00:00:00"))/86400000);
const STATUS={"待審核":"warn","處理中":"teal","已核准":"ok","已退回":"bad"};
const initials=n=>(n||"  ").slice(-2);
const avaColor=u=>UNITS[u]?UNITS[u].color:"#5c6b72";

/* ---------- Supabase 正規化（snake_case → 元件用欄位） ---------- */
const normAnn=r=>({id:r.id,title:r.title,body:r.body,unit:r.unit,cat:r.category,pinned:r.pinned,date:r.publish_date,author:r.author});
const normEvt=r=>({id:r.id,title:r.title,date:r.event_date,unit:r.unit,type:r.type,loc:r.location,desc:r.description});
const normRes=r=>({id:r.id,title:r.title,unit:r.unit,cat:r.category,desc:r.description,date:r.updated_date,link:r.link});
const normReq=r=>({id:r.id,type:r.type,title:r.title,applicant:r.applicant_name,role:r.applicant_role,group:r.group_unit,status:r.status,createdAt:r.created_date,reviewer:r.reviewer,reviewedAt:r.reviewed_at,note:r.note,fields:r.fields||{}});

async function fetchAll(){
  const [a,e,r,q]=await Promise.all([
    sb.from("announcements").select("*").order("pinned",{ascending:false}).order("publish_date",{ascending:false}),
    sb.from("events").select("*").order("event_date",{ascending:true}),
    sb.from("resources").select("*").order("updated_date",{ascending:false}),
    sb.from("requests").select("*").order("created_at",{ascending:false}),
  ]);
  return {
    announcements:(a.data||[]).map(normAnn),
    events:(e.data||[]).map(normEvt),
    resources:(r.data||[]).map(normRes),
    requests:(q.data||[]).map(normReq),
  };
}

/* ---------- 小元件 ---------- */
function Seal({size}){return(<div className={"seal "+(size||"")}><span>教</span><span>務</span><span>處</span><span>印</span></div>);}
function Ava({user,cls}){return(<div className={"role-ava "+(cls||"")} style={{background:avaColor(user.unit)}}>{initials(user.name)}</div>);}
function Tag({children,kind,unit}){return <span className={"tag "+(kind||"")+(unit?" unit":"")}>{children}</span>;}
function Empty({ico,title,sub}){return(<div className="empty"><div className="big">{ico||"🗂️"}</div><div style={{fontWeight:600,color:"var(--ink)"}}>{title}</div>{sub&&<div style={{fontSize:13,marginTop:4}}>{sub}</div>}</div>);}
function Modal({title,onClose,children,foot,wide}){
  useEffect(()=>{const h=e=>{if(e.key==="Escape")onClose();};window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);},[]);
  return(<div className="overlay" onMouseDown={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className={"modal"+(wide?" wide":"")}>
      <div className="modal-head"><h3>{title}</h3><button className="x" onClick={onClose}>×</button></div>
      <div className="modal-body">{children}</div>{foot&&<div className="modal-foot">{foot}</div>}
    </div></div>);
}
function Field({label,req,hint,children}){return(<div className="field"><label>{label}{req&&<span className="req"> ＊</span>}</label>{children}{hint&&<div className="hint">{hint}</div>}</div>);}

/* ============================ LOGIN ============================ */
function Login({onError,err}){

  async function go(){
    if(!email||!pw)return;setBusy(true);onError("");
    const {error}=await sb.auth.signInWithPassword({email:email.trim(),password:pw});
    if(error)onError(error.message==="Invalid login credentials"?"帳號或密碼錯誤，請再確認。":error.message);
    setBusy(false);
  }
  return(<div className="login-wrap"><div className="login-card">

      <div><p className="login-eyebrow">LUJIANG ELEMENTARY</p>

        <p className="login-sub">請以學校帳號登入</p></div>
    </div>
    <div className="login-body">
      {err&&<div className="err">{err}</div>}
      <Field label="電子郵件"><input type="email" value={email} autoComplete="username"
        onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="name@lujiang.edu.tw"/></Field>
      <Field label="密碼"><input type="password" value={pw} autoComplete="current-password"
        onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="••••••••"/></Field>
      <button className="btn primary block" disabled={busy} onClick={go}>{busy?"登入中…":"登入"}</button>
      <div className="login-foot">示範帳號（密碼於 Supabase 建立時設定）：主任 <code>director@lujiang.edu.tw</code>、教學組 <code>teach@…</code>、教師 <code>teacher@…</code>、家長 <code>parent@…</code>。完整清單見 README。</div>
    </div>
  </div></div>);
}

  function del(a){confirm("刪除公告","確定刪除「"+a.title+"」？此動作無法復原。",async()=>{if(await actions.deleteAnnouncement(a.id))toast("公告已刪除");});}

/* ============================ CALENDAR ============================ */

  async function onSave(rec){if(await actions.saveEvent(rec)){setEdit(null);toast("行事曆已更新");}}
  function del(e){confirm("刪除活動","確定移除「"+e.title+"」？",async()=>{if(await actions.deleteEvent(e.id))toast("活動已刪除");});}
  return(<div>
    <div className="page-head"><div className="ph-txt"><h2>全校行事曆</h2><p>由課程組彙整、各組維護的學校重要行事與活動。</p></div>
      {canManage&&<div className="ph-actions"><button className="btn seal" onClick={()=>setEdit({title:"",date:ymd(TODAY),unit:user.unit==="主任"?"課程組":user.unit,type:"活動",loc:"",desc:""})}>＋ 新增行事</button></div>}</div>
    {Object.keys(groups).map(m=>(<div key={m}><div className="cal-month">{m}<span className="ln"></span></div>
      {groups[m].map(e=>{const past=daysFromToday(e.date)<0;return(<div className="ev" key={e.id} style={past?{opacity:.6}:{}}>
        <div className="ev-date"><div className="d">{dayNum(e.date)}</div><div className="w">{dayW(e.date)}</div></div>
        <div className="ev-main"><b>{e.title}</b><div className="ev-meta"><Tag unit>{e.unit}</Tag><Tag kind="teal">{e.type}</Tag>{e.loc&&<span>📍 {e.loc}</span>}{daysFromToday(e.date)===0&&<Tag kind="seal">今天</Tag>}</div>
          {e.desc&&<div style={{fontSize:13,color:"var(--muted)",marginTop:5}}>{e.desc}</div>}</div>
        {canManage&&(user.unit==="主任"||user.unit===e.unit)&&<div className="r-side"><button className="btn ghost sm" onClick={()=>setEdit(e)}>編輯</button><button className="btn ghost sm" onClick={()=>del(e)}>刪除</button></div>}

function Requests({data,user,actions,toast}){
  const [tab,setTab]=useState(user.role==="staff"?"inbox":"mine");
  const [form,setForm]=useState(null);const [review,setReview]=useState(null);
  const canReview=user.role==="staff";
  const available=REQ_TYPES.filter(t=>t.who.includes(user.role));
  const mine=data.requests.filter(r=>r.applicant===user.name);
  const inbox=user.unit==="主任"?data.requests:data.requests.filter(r=>r.group===user.unit);
  async function submit(rec){const t=REQ_TYPES.find(x=>x.id===rec.type);
    if(await actions.submitRequest(rec)){setForm(null);setTab("mine");toast("申請已送出，將由"+t.group+"審核");}}
  async function decide(rec,status,note){if(await actions.reviewRequest(rec,status,note)){setReview(null);toast("已"+status);}}
  const Card=({r,reviewable})=>{const t=REQ_TYPES.find(x=>x.id===r.type);return(
    <div className="row"><div className="r-main"><div className="r-title">{t?t.ico:"📄"} {r.title}</div>
      <div className="r-meta"><Tag unit>{r.group}</Tag>申請人：{r.applicant}<span>·</span>{fmtD(r.createdAt)}{r.reviewer&&<span>· 審核：{r.reviewer}</span>}</div></div>
      <div className="r-side"><Tag kind={STATUS[r.status]}>{r.status}</Tag><button className="btn sm" onClick={()=>setReview({r,reviewable})}>{reviewable&&r.status==="待審核"?"審核":"檢視"}</button></div></div>);};
  return(<div>
    <div className="page-head"><div className="ph-txt"><h2>線上申請</h2><p>調代課、研習、獎助學金、學籍異動與場地借用，線上送件、即時追蹤。</p></div>
      <div className="ph-actions"><button className="btn seal" onClick={()=>setForm({pick:true})}>＋ 新增申請</button></div></div>
    <div className="filters">
      {canReview&&<button className={"chip"+(tab==="inbox"?" active":"")} onClick={()=>setTab("inbox")}>待我審核 {inbox.filter(r=>r.status==="待審核").length>0&&"· "+inbox.filter(r=>r.status==="待審核").length}</button>}
      <button className={"chip"+(tab==="mine"?" active":"")} onClick={()=>setTab("mine")}>我送出的申請</button></div>
    <div className="card panel">
      {tab==="inbox"?(inbox.length===0?<Empty ico="📭" title="目前沒有待審核或已處理的申請"/>:
        [...inbox].sort((a,b)=>(a.status==="待審核"?-1:1)-(b.status==="待審核"?-1:1)||b.createdAt.localeCompare(a.createdAt)).map(r=><Card key={r.id} r={r} reviewable/>)
      ):(mine.length===0?<Empty ico="📝" title="您尚未送出任何申請" sub="點右上「新增申請」開始"/>:
        mine.map(r=><Card key={r.id} r={r}/>))}
    </div>
    {form&&form.pick&&<PickType available={available} onPick={t=>setForm({type:t})} onClose={()=>setForm(null)}/>}
    {form&&form.type&&<RequestForm type={form.type} onClose={()=>setForm(null)} onSubmit={submit}/>}
    {review&&<ReviewModal data={review} user={user} onClose={()=>setReview(null)} onDecide={decide}/>}
  </div>);
}
function PickType({available,onPick,onClose}){
  return(<Modal title="選擇申請類別" onClose={onClose} wide><div className="req-grid">
    {available.map(t=>(<button key={t.id} className="req-type" onClick={()=>onPick(t)}><div className="rt-ico">{t.ico}</div><b>{t.name}</b><span>承辦：{t.group}</span></button>))}
  </div></Modal>);
}
function RequestForm({type,onClose,onSubmit}){
  const [v,setV]=useState({});const [busy,setBusy]=useState(false);
  const ok=type.fields.filter(f=>f.req).every(f=>(v[f.k]||"").toString().trim());
  async function submit(){setBusy(true);await onSubmit({type:type.id,fields:v});setBusy(false);}
  return(<Modal title={type.ico+" "+type.name} onClose={onClose}
    foot={<><button className="btn ghost" onClick={onClose}>取消</button><button className="btn seal" disabled={!ok||busy} onClick={submit}>{busy?"送出中…":"送出申請"}</button></>}>
    <div style={{marginBottom:14,fontSize:13,color:"var(--muted)"}}>本申請將送交 <b style={{color:"var(--navy)"}}>{type.group}</b> 審核。</div>
    {type.fields.map(f=>(<Field key={f.k} label={f.l} req={f.req}>
      {f.t==="area"?<textarea value={v[f.k]||""} onChange={e=>setV({...v,[f.k]:e.target.value})} placeholder={f.ph||""}/>:
       f.t==="select"?<select value={v[f.k]||""} onChange={e=>setV({...v,[f.k]:e.target.value})}><option value="">請選擇…</option>{f.opt.map(o=><option key={o}>{o}</option>)}</select>:
       <input type={f.t==="date"?"date":"text"} value={v[f.k]||""} onChange={e=>setV({...v,[f.k]:e.target.value})} placeholder={f.ph||""}/>}</Field>))}
  </Modal>);
}
function ReviewModal({data,user,onClose,onDecide}){
  const {r,reviewable}=data;const t=REQ_TYPES.find(x=>x.id===r.type);
  const [note,setNote]=useState(r.note||"");const [busy,setBusy]=useState(false);
  const canAct=reviewable&&r.status==="待審核"&&(user.unit==="主任"||user.unit===r.group);
  async function act(s){setBusy(true);await onDecide(r,s,note);setBusy(false);}
  return(<Modal title={t.ico+" "+r.title} onClose={onClose} wide
    foot={canAct?<><button className="btn" disabled={busy} onClick={()=>act("已退回")} style={{borderColor:"var(--bad)",color:"var(--bad)"}}>退回</button>
      <div style={{flex:1}}></div><button className="btn primary" disabled={busy} onClick={()=>act("處理中")}>標記處理中</button>

    <div className="detail-row"><div className="dl">申請人</div><div className="dv">{r.applicant}</div></div>
    <div className="detail-row"><div className="dl">承辦組別</div><div className="dv">{r.group}</div></div>
    <div className="detail-row"><div className="dl">申請日期</div><div className="dv">{fmtD(r.createdAt)}</div></div>
    {t.fields.map(f=>r.fields[f.k]&&(<div className="detail-row" key={f.k}><div className="dl">{f.l}</div><div className="dv">{f.k==="date"||f.k==="edate"?fmtD(r.fields[f.k]):r.fields[f.k]}</div></div>))}

    {canAct?<Field label="承辦回覆 / 備註"><textarea value={note} onChange={e=>setNote(e.target.value)} placeholder="可填寫核准條件或退回原因…"/></Field>

/* ============================ APP ============================ */
const NAV=[
  {k:"dash",label:"總覽",ico:"🏠",roles:["staff"]},
  {k:"ann",label:"公告中心",ico:"📢",roles:["staff","teacher","public"]},
  {k:"calendar",label:"全校行事曆",ico:"📅",roles:["staff","teacher","public"]},
  {k:"requests",label:"線上申請",ico:"📝",roles:["staff","teacher","public"]},
  {k:"resources",label:"教學資源",ico:"📚",roles:["staff","teacher","public"]},
  {k:"schedule",label:"課表與作息",ico:"⏰",roles:["staff","teacher","public"]},
  {k:"directory",label:"業務職掌",ico:"🗂️",roles:["staff","teacher","public"]},
  {k:"admin",label:"系統管理",ico:"⚙️",roles:["admin"]},
];
const TITLES={dash:"總覽",ann:"公告中心",calendar:"全校行事曆",requests:"線上申請",resources:"教學資源",schedule:"課表與作息",directory:"教務處業務職掌",admin:"系統管理"};

function App(){
  const [booting,setBooting]=useState(true);
  const [user,setUser]=useState(null);
  const [data,setData]=useState({announcements:[],events:[],resources:[],requests:[]});
  const [view,setView]=useState("ann");
  const [toast,setToast]=useState(null);
  const [confirmBox,setConfirmBox]=useState(null);
  const [menu,setMenu]=useState(false);
  const [loginErr,setLoginErr]=useState("");
  const chanRef=useRef(null);

  const pushToast=useCallback((m,bad)=>{setToast({m,bad});setTimeout(()=>setToast(null),2400);},[]);
  const refresh=useCallback(async()=>{const d=await fetchAll();setData(d);},[]);

  async function loadProfile(authUser){
    let {data:p}=await sb.from("profiles").select("*").eq("id",authUser.id).maybeSingle();
    if(!p){p={id:authUser.id,name:(authUser.email||"").split("@")[0],title:"",role:"public",unit:"教師"};}
    const u={id:p.id,name:p.name,title:p.title,role:p.role,unit:p.unit};
    setUser(u);setView(u.role==="staff"?"dash":"ann");
    await refresh();
    if(chanRef.current)sb.removeChannel(chanRef.current);
    chanRef.current=sb.channel("rt").on("postgres_changes",{event:"*",schema:"public"},()=>refresh()).subscribe();
    setBooting(false);
  }

  useEffect(()=>{
    if(!CONFIGURED){setBooting(false);return;}
    sb.auth.getSession().then(({data})=>{ if(data.session)loadProfile(data.session.user); else setBooting(false); });
    const {data:sub}=sb.auth.onAuthStateChange((_e,session)=>{
      if(session)loadProfile(session.user);
      else{setUser(null);if(chanRef.current)sb.removeChannel(chanRef.current);setBooting(false);}
    });
    return ()=>sub.subscription.unsubscribe();
  },[]);

  async function logout(){await sb.auth.signOut();}
  function askConfirm(title,msg,fn){setConfirmBox({title,msg,fn});}

  /* ---- 寫入動作（RLS 在資料庫端把關，前端回報結果） ---- */
  const fail=err=>{console.error(err);pushToast(err?.message?("操作失敗："+err.message):"操作失敗，可能是權限不足。",true);return false;};
  const actions={
    async saveAnnouncement(r){
      const row={title:r.title,body:r.body,unit:r.unit,category:r.cat,pinned:r.pinned,publish_date:r.date,author:r.author};
      const {error}=r.id?await sb.from("announcements").update(row).eq("id",r.id)
        :await sb.from("announcements").insert({...row,created_by:user.id});
      return error?fail(error):(await refresh(),true);
    },
    async deleteAnnouncement(id){const {error}=await sb.from("announcements").delete().eq("id",id);return error?fail(error):(await refresh(),true);},
    async saveEvent(r){
      const row={title:r.title,event_date:r.date,unit:r.unit,type:r.type,location:r.loc,description:r.desc};
      const {error}=r.id?await sb.from("events").update(row).eq("id",r.id):await sb.from("events").insert({...row,created_by:user.id});
      return error?fail(error):(await refresh(),true);
    },
    async deleteEvent(id){const {error}=await sb.from("events").delete().eq("id",id);return error?fail(error):(await refresh(),true);},
    async saveResource(r){
      const row={title:r.title,unit:r.unit,category:r.cat,description:r.desc,link:r.link,updated_date:r.date};
      const {error}=r.id?await sb.from("resources").update(row).eq("id",r.id):await sb.from("resources").insert({...row,created_by:user.id});
      return error?fail(error):(await refresh(),true);
    },
    async deleteResource(id){const {error}=await sb.from("resources").delete().eq("id",id);return error?fail(error):(await refresh(),true);},
    async submitRequest(rec){
      const t=REQ_TYPES.find(x=>x.id===rec.type);
      const {error}=await sb.from("requests").insert({
        type:rec.type,title:t.name,applicant_id:user.id,applicant_name:user.name,applicant_role:user.role,
        group_unit:t.group,status:"待審核",fields:rec.fields,created_date:ymd(TODAY)});
      return error?fail(error):(await refresh(),true);
    },
    async reviewRequest(rec,status,note){
      const {error}=await sb.from("requests").update({status,note,reviewer:user.name,reviewed_at:ymd(TODAY)}).eq("id",rec.id);
      return error?fail(error):(await refresh(),true);
    },
  };

  if(!CONFIGURED)return <Setup/>;
  if(booting)return(<div className="loading"><div className="spin"></div><div>連線教務處平台…</div></div>);
  if(!user)return <Login onError={setLoginErr} err={loginErr}/>;

  const isAdmin=user.unit==="主任"||user.unit==="資訊組";
  const nav=NAV.filter(n=>n.roles.includes(user.role)||(n.roles.includes("admin")&&isAdmin));
  const pendingForMe=data.requests.filter(r=>r.status==="待審核"&&(user.unit==="主任"||r.group===user.unit)).length;
  function go(k){setView(k);setMenu(false);}

  const content=(()=>{switch(view){
    case"dash":return <Dashboard data={data} user={user} go={go}/>;
    case"ann":return <Announcements data={data} user={user} actions={actions} toast={pushToast} confirm={askConfirm}/>;
    case"calendar":return <Calendar data={data} user={user} actions={actions} toast={pushToast} confirm={askConfirm}/>;
    case"requests":return <Requests data={data} user={user} actions={actions} toast={pushToast}/>;
    case"resources":return <Resources data={data} user={user} actions={actions} toast={pushToast} confirm={askConfirm}/>;
    case"schedule":return <Schedule/>;
    case"directory":return <Directory/>;
    case"admin":return <Admin data={data} user={user}/>;
    default:return null;
  }})();

  const todayStr=`民國 ${TODAY.getFullYear()-1911} 年 ${TODAY.getMonth()+1} 月 ${TODAY.getDate()} 日 · ${dayW(ymd(TODAY))}`;

  return(<div className="shell">
    {menu&&<div className="scrim" onClick={()=>setMenu(false)}></div>}
    <aside className={"sidebar"+(menu?" open":"")}>
      <div className="brand"><Seal/><div className="brand-txt"><b>鷺江國小</b><span>教務處整合服務平台</span></div></div>
      <nav className="nav"><div className="nav-sec">功能選單</div>
        {nav.map(n=>(<button key={n.k} className={"nav-item"+(view===n.k?" active":"")} onClick={()=>go(n.k)}>
          <span className="ico">{n.ico}</span>{n.label}
          {n.k==="requests"&&user.role==="staff"&&pendingForMe>0&&<span className="badge">{pendingForMe}</span>}</button>))}
      </nav>
      <div className="side-foot"><div className="userline"><Ava user={user}/><div><b>{user.name}</b><span>{user.title||user.unit}</span></div></div>
        <button className="logout" onClick={logout}>登出</button></div>
    </aside>
    <div className="main">
      <header className="topbar"><button className="btn ghost menu-btn" onClick={()=>setMenu(true)}>☰</button>
        <div><h1>{TITLES[view]}</h1><div className="crumb">教務處 · {user.unit}{user.role==="staff"?"（承辦）":"（檢視）"}</div></div>
        <div className="topbar-right"><span className="date-chip">{todayStr}</span></div></header>
      <div className="content">{content}</div>
    </div>
    {toast&&<div className="toast-wrap"><div className={"toast"+(toast.bad?" err-t":"")}><span className="dot">●</span>{toast.m}</div></div>}
    {confirmBox&&<Modal title={confirmBox.title} onClose={()=>setConfirmBox(null)}
      foot={<><button className="btn ghost" onClick={()=>setConfirmBox(null)}>取消</button>
        <button className="btn seal" onClick={()=>{confirmBox.fn();setConfirmBox(null);}}>確定</button></>}>
      <p style={{margin:0,fontSize:14,color:"#3a4750"}}>{confirmBox.msg}</p></Modal>}
  </div>);
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
